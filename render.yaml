services:
  - type: web
    name: gm-andreou-marmi
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/site
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gm-andreou-marmi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        value: gmarmi@cytanet.com.cy

databases:
  - name: gm-andreou-marmi-db
    plan: basic-256mb
