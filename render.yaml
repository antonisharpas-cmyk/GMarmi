# Render Blueprint for the GM Andreou Marmi website, same setup as the APEX site:
# one Web Service and one persistent disk. The database is SQLite in a single file on the disk,
# so there is no Postgres service. Without the disk, every deploy would wipe the catalogue,
# photos, enquiries and chats.
services:
  - type: web
    name: gm-andreou-marmi
    runtime: node
    # Frankfurt is Render's closest region to Cyprus.
    region: frankfurt
    # The build runs on separate compute, so this is only what the running site needs.
    # The free plan cannot hold a disk.
    plan: 0.5c-512mb
    # --include=dev: vite, tailwind and typescript are devDependencies and the build needs them,
    # even if NODE_ENV is set to production somewhere.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/site
    disk:
      name: gmarmi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # A FILE PATH, not a connection string. Never put a postgres:// URL here; the server refuses it.
      - key: DATABASE_URL
        value: file:/var/data/gmarmi.db
      # better-sqlite3 is a native module; a fixed Node version means a prebuilt binary on every deploy.
      - key: NODE_VERSION
        value: 22.23.2
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      # Read once, when the disk is empty, to create the first accounts.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_EMAIL
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      # Email. Without SMTP_HOST, emails are only written to the log.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        value: gmarmi@cytanet.com.cy
